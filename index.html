<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabiTalk 日本語 - 10-Day Tourist Japanese</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .chat-bubble-npc::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 20px;
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🗾</span>
        <div>
          <h1 class="text-lg font-extrabold text-red-600 leading-tight">TabiTalk <span class="text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-bold uppercase">Japan 10-Day</span></h1>
          <p class="text-xs text-slate-400">Survival Tourist Japanese</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <!-- Audio Speed Toggle -->
        <button id="speedBtn" onclick="toggleSpeed()" class="text-xs font-semibold px-2.5 py-1 bg-slate-100 border border-slate-200 rounded-full text-slate-600 flex items-center gap-1">
          <i data-lucide="gauge" class="w-3.5 h-3.5"></i>
          <span id="speedLabel">1.0x</span>
        </button>
        <!-- Romaji Toggle -->
        <button id="romajiToggle" onclick="toggleRomaji()" class="text-xs font-semibold px-2.5 py-1 bg-red-50 text-red-600 border border-red-200 rounded-full">
          Romaji: ON
        </button>
      </div>
    </div>
  </header>

  <!-- Main App Container -->
  <main class="max-w-2xl mx-auto w-full flex-1 p-4 pb-24">
    
    <!-- View Switcher -->
    <div class="flex bg-slate-200 p-1 rounded-xl mb-4 text-xs font-bold">
      <button onclick="switchView('lessons')" id="tabLessons" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-slate-800 transition flex justify-center items-center gap-1.5">
        <i data-lucide="message-square" class="w-4 h-4"></i> Situations
      </button>
      <button onclick="switchView('phrasebook')" id="tabPhrasebook" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-800 transition flex justify-center items-center gap-1.5">
        <i data-lucide="book-marked" class="w-4 h-4"></i> Cheat Sheet
      </button>
    </div>

    <!-- VIEW 1: SCENARIOS / LESSONS -->
    <div id="viewLessons" class="space-y-4">
      <!-- Welcome Hero -->
      <div class="bg-gradient-to-r from-red-500 to-rose-600 rounded-2xl p-4 text-white shadow-lg shadow-red-200">
        <div class="flex justify-between items-start">
          <div>
            <h2 class="font-black text-lg">Kon'nichiwa, Tourist! ⛩️</h2>
            <p class="text-xs text-red-100 mt-1 max-w-sm">Tap any scenario to start a Falou-style simulated dialogue. Practice listening and replying out loud!</p>
          </div>
          <div class="bg-white/20 px-2.5 py-1 rounded-full text-xs font-bold" id="tripDayTracker">
            10-Day Ready
          </div>
        </div>
      </div>

      <!-- Scenarios Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="scenariosGrid">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- VIEW 2: PHRASEBOOK -->
    <div id="viewPhrasebook" class="hidden space-y-4">
      <div class="relative">
        <input type="text" id="phraseSearch" oninput="filterPhrases()" placeholder="Search (e.g., toilet, water, bill, train)..." class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
      </div>
      <div id="phrasesList" class="space-y-2">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- DIALOGUE RUNNER MODAL / INTERFACE -->
    <div id="dialogueModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
      <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom">
        
        <!-- Modal Top Bar -->
        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
          <div class="flex items-center gap-2">
            <span id="activeScenarioIcon" class="text-2xl">🍜</span>
            <div>
              <h3 id="activeScenarioTitle" class="font-bold text-slate-800 text-sm">Restaurant Ordering</h3>
              <p id="activeStepProgress" class="text-xs text-slate-400 font-semibold">Step 1 of 4</p>
            </div>
          </div>
          <button onclick="closeDialogue()" class="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-200 transition">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Chat History Scroll View -->
        <div id="chatContainer" clas
